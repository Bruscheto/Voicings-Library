packages:
  - apps/*
  - packages/*
  - e2e

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  # Platform packages provide the resolver binary; do not run its fallback installer.
  unrs-resolver: false

# Next.js 15 pins PostCSS; keep every affected PostCSS 8 consumer patched.
# GHSA-fxqj-rqcc-2cmp (and earlier source-map disclosure advisories).
overrides:
  'postcss@>=8.0.0 <8.5.28': 8.5.28
